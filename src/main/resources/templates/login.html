<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login - Tugas Deploy</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            min-height: 100vh;
            background: #0f0f1a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
        }
        .login-wrapper {
            display: flex;
            width: 580px;
            min-height: 480px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 24px 60px rgba(0,0,0,0.5);
        }
        .login-side {
            width: 220px;
            background: #1a1a2e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
            gap: 1rem;
        }
        .avatar-wrap {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 2px solid rgba(99,84,255,0.5);
            overflow: hidden;
            box-shadow: 0 0 0 4px rgba(99,84,255,0.15);
        }
        .avatar-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .side-title {
            color: #e0d9ff;
            font-weight: 600;
            font-size: 14px;
            text-align: center;
            line-height: 1.5;
        }
        .side-divider {
            width: 40px;
            height: 1px;
            background: rgba(255,255,255,0.1);
        }
        .nim-badge {
            background: rgba(99,84,255,0.2);
            border: 1px solid rgba(99,84,255,0.4);
            border-radius: 99px;
            padding: 4px 12px;
            color: #a89aff;
            font-size: 11px;
        }
        .quote-block {
            background: rgba(99,84,255,0.1);
            border-left: 3px solid rgba(99,84,255,0.6);
            border-radius: 0 8px 8px 0;
            padding: 10px 12px;
            width: 100%;
        }
        .quote-text {
            color: rgba(220,215,255,0.85);
            font-size: 12px;
            font-style: italic;
            line-height: 1.6;
            margin: 0;
        }
        .quote-author {
            color: rgba(160,150,220,0.6);
            font-size: 10px;
            margin-top: 6px;
            display: block;
        }
        .side-app-label {
            color: rgba(160,150,220,0.5);
            font-size: 10px;
            text-align: center;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
        .login-main {
            flex: 1;
            background: #fff;
            padding: 2.5rem 2rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .login-main h2 {
            font-size: 20px;
            font-weight: 700;
            color: #1a1a2e;
            margin-bottom: 4px;
        }
        .login-main p.sub {
            font-size: 13px;
            color: #888;
            margin-bottom: 1.75rem;
        }
        .form-label {
            font-size: 13px;
            font-weight: 600;
            color: #444;
        }
        .form-control {
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            height: 42px;
            font-size: 14px;
            padding-left: 14px;
            transition: border 0.2s, box-shadow 0.2s;
        }
        .form-control:focus {
            border-color: #6354ff;
            box-shadow: 0 0 0 3px rgba(99,84,255,0.12);
        }
        .btn-login {
            width: 100%;
            height: 42px;
            background: #6354ff;
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: 0.5rem;
        }
        .btn-login:hover { opacity: 0.88; }
        .footer-note {
            font-size: 12px;
            color: #aaa;
            text-align: center;
            margin-top: 1.25rem;
        }
    </style>
</head>
